<!doctype html>
<meta charset="utf-8">
<title>Planet prop regression checks</title>
<pre id="results">Running...</pre>
<script src="../vendor/three.min.js"></script>
<script src="../js/util.js"></script>
<script src="../js/data.js"></script>
<script src="../js/models.js"></script>
<script>
try {
  const check = (value, message) => { if (!value) throw Error(message); };
  const dish = buildDish(); dish.updateMatrixWorld(true);
  const bowl = dish.getObjectByName('satellite-reflector');
  const positions = bowl.geometry.attributes.position;
  let views = 0;
  // Rays approach actual surface triangles from inside and outside the tilted dish.
  for (let i = 36; i < positions.count; i += 57) {
    const a = new V3().fromBufferAttribute(positions, i);
    const b = new V3().fromBufferAttribute(positions, i + 1);
    const c = new V3().fromBufferAttribute(positions, i + 2);
    const normal = b.clone().sub(a).cross(c.clone().sub(a)).normalize();
    if (normal.lengthSq() < 0.5) continue;
    const center = a.add(b).add(c).multiplyScalar(1 / 3);
    bowl.localToWorld(center);
    normal.applyNormalMatrix(new THREE.Matrix3().getNormalMatrix(bowl.matrixWorld));
    for (const side of [-1, 1]) {
      const ray = new THREE.Raycaster(center.clone().addScaledVector(normal, side * .05), normal.clone().multiplyScalar(-side), 0, .1);
      check(ray.intersectObject(bowl).length > 0, 'Reflector missing from side ' + side);
      views++;
    }
  }
  for (let seed = 1; seed <= 30; seed++) {
    const rng = U.seeded(seed), expected = U.seeded(seed);
    const radius = .5 + expected() * 1.4; expected(); expected(); expected();
    const rock = buildRock(rng, '#8f6b52');
    check(rock.userData.r === radius * .8, 'Collision radius changed');
    check(rng() === expected(), 'World random stream changed');
    mergeStatic(rock);
    rock.traverse(mesh => {
      if (!mesh.isMesh) return;
      check(Array.from(mesh.geometry.attributes.position.array).every(Number.isFinite), 'Invalid geometry');
    });
    disposeObj(rock);
  }
  window.testResult = { ok: true, views, seeds: 30 };
} catch (e) { window.testResult = { ok: false, error: e.stack }; }
document.getElementById('results').textContent = JSON.stringify(window.testResult, null, 2);
</script>
